<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Poll</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --fg: #111827; --muted: #6b7280; --border: #e2e5ea;
    --accent: #2563eb; --accent-fg: #ffffff; --ok: #15803d; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b22; --fg: #f3f4f6; --muted: #9aa1ad; --border: #2a2f3a;
      --accent: #3b82f6; --ok: #4ade80; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .brand {
    display: flex; align-items: center; gap: 8px; margin-bottom: 22px;
    font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: #22c55e; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 20px; }
  .options { display: grid; gap: 10px; }
  .opt {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    font: inherit; font-weight: 600; padding: 16px 18px; cursor: pointer;
    border-radius: 14px; border: 2px solid var(--border); background: var(--card); color: var(--fg);
  }
  .opt:active { transform: scale(.99); }
  .opt:disabled { opacity: .7; }
  .mark { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); }
  .opt.selected { border-color: var(--accent); }
  .opt.selected .mark { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 4px var(--card); }
  textarea {
    width: 100%; font: inherit; padding: 14px 16px; resize: none;
    border-radius: 14px; border: 2px solid var(--border); background: var(--card); color: var(--fg);
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .counter { font-size: 13px; color: var(--muted); text-align: right; margin-top: 6px; }
  .send {
    margin-top: 10px; width: 100%; font: inherit; font-weight: 700; padding: 15px; cursor: pointer;
    border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-fg);
  }
  .send:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 16px; min-height: 1.4em; font-weight: 600; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
  .waiting { text-align: center; padding: 72px 8px; color: var(--muted); }
  .pulse {
    width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin: 0 auto 18px;
    animation: pulse 1.6s infinite ease-in-out;
  }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="dot" id="dot"></span>Live poll</div>
  <div id="view"></div>
</main>
<script>
  const view = document.getElementById('view');
  const dot = document.getElementById('dot');

  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
  function keep(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  function randomId() {
    const a = new Uint8Array(16);
    crypto.getRandomValues(a);
    return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }
  function el(tag, text, cls) {
    const e = document.createElement(tag);
    if (text != null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  let voter = load('poll-voter');
  if (!voter) { voter = randomId(); keep('poll-voter', voter); }
  const choices = load('poll-choices') || {}; // pollId -> option index
  const sent = load('poll-sent') || {};       // pollId -> number of text responses sent

  async function submit(pollId, value) {
    const r = await fetch('/api/vote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pollId, voter, value }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Something went wrong - please try again');
    return data;
  }

  let current = null;
  let currentSig = '';

  function render(poll, force) {
    const sig = JSON.stringify(poll);
    if (sig === currentSig && !force) return; // don't wipe a half-typed answer
    currentSig = sig;
    current = poll;
    view.replaceChildren();
    if (!poll) {
      const w = el('div', null, 'waiting');
      w.append(el('div', null, 'pulse'), el('div', 'Waiting for the next question…'));
      view.append(w);
      return;
    }
    view.append(el('h1', poll.question));
    if (poll.type === 'choice') renderChoice(poll);
    else renderText(poll);
  }

  function renderChoice(poll) {
    const wrap = el('div', null, 'options');
    const msg = el('div', null, 'msg ok');
    if (choices[poll.id] !== undefined) msg.textContent = 'Vote received. Tap another option to change it.';
    const buttons = poll.options.map((label, i) => {
      const b = el('button', null, 'opt');
      b.type = 'button';
      b.append(el('span', null, 'mark'), el('span', label));
      b.classList.toggle('selected', choices[poll.id] === i);
      b.onclick = async () => {
        buttons.forEach((x) => (x.disabled = true));
        try {
          await submit(poll.id, i);
          choices[poll.id] = i;
          keep('poll-choices', choices);
          buttons.forEach((x, j) => x.classList.toggle('selected', j === i));
          msg.className = 'msg ok';
          msg.textContent = 'Vote received. Tap another option to change it.';
        } catch (err) {
          msg.className = 'msg err';
          msg.textContent = err.message;
        } finally {
          buttons.forEach((x) => (x.disabled = false));
        }
      };
      wrap.append(b);
      return b;
    });
    view.append(wrap, msg);
  }

  function renderText(poll) {
    const MAX = 3;
    const ta = el('textarea');
    ta.rows = 3;
    ta.maxLength = 100;
    ta.placeholder = 'Type your answer';
    const counter = el('div', '0/100', 'counter');
    const btn = el('button', 'Send', 'send');
    const msg = el('div', null, 'msg');

    function update() {
      const left = MAX - (sent[poll.id] || 0);
      counter.textContent = `${ta.value.length}/100`;
      btn.disabled = !ta.value.trim() || left <= 0;
      ta.disabled = left <= 0;
      if (left <= 0) { msg.className = 'msg ok'; msg.textContent = 'Thanks! Your responses are in.'; }
    }

    async function go() {
      if (btn.disabled) return;
      btn.disabled = true;
      try {
        const r = await submit(poll.id, ta.value);
        sent[poll.id] = MAX - r.remaining;
        keep('poll-sent', sent);
        ta.value = '';
        msg.className = 'msg ok';
        msg.textContent = r.remaining > 0
          ? `Sent! You can send ${r.remaining} more.`
          : 'Thanks! Your responses are in.';
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = err.message;
      }
      update();
    }

    ta.addEventListener('input', update);
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
    });
    btn.onclick = go;
    view.append(ta, counter, btn, msg);
    update();
  }

  let es = null;
  function connect() {
    if (es) es.close();
    es = new EventSource('/api/events');
    es.addEventListener('active', (e) => render(JSON.parse(e.data)));
    es.addEventListener('reset', (e) => {
      const id = JSON.parse(e.data);
      delete choices[id];
      delete sent[id];
      keep('poll-choices', choices);
      keep('poll-sent', sent);
      if (current && current.id === id) render(current, true);
    });
    es.onopen = () => dot.classList.add('live');
    es.onerror = () => {
      dot.classList.remove('live');
      if (es.readyState === EventSource.CLOSED) setTimeout(connect, 3000);
    };
  }

  // Phones drop the connection when locked; reconnect as soon as the page is visible again.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && (!es || es.readyState === EventSource.CLOSED)) connect();
  });

  render(null, true);
  connect();
</script>
</body>
</html>
